version: '3.8'

services:
  db:
    image: postgres:15
    container_name: quickserve_db
    restart: always
    environment:
      POSTGRES_USER: quickserve_user
      POSTGRES_PASSWORD: quickserve_password
      POSTGRES_DB: quickserve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
